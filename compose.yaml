services:
  postgres:
    image: postgres:latest
    container_name: lms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-lms-backend:local}
    build:
      context: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lms_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-lmsminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-lmsminio123}
      MINIO_BUCKET: ${MINIO_BUCKET:-lms-files}
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8082}/realms/lms
      KEYCLOAK_ADMIN_URL: http://keycloak:8080/admin/realms/lms
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/lms/protocol/openid-connect/token
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/lms/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  keycloak-db:
    image: postgres:17
    networks:
      - keycloak-internal
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    networks:
      - default
      - keycloak-internal
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak/lms-realm.json:/opt/keycloak/data/import/lms-realm.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8082}:8080"
    environment:
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8082}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: lms-minio:local
    build:
      context: ./minio
      target: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lmsminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lmsminio123}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: lms-minio-mc:local
    build:
      context: ./minio
      target: mc
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lmsminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lmsminio123}
      MINIO_BUCKET: ${MINIO_BUCKET:-lms-files}
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attempts=0
        until mc alias set storage http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 60 ]; then exit 1; fi
          sleep 2
        done
        mc mb --ignore-existing "storage/$$MINIO_BUCKET"
        mc anonymous set none "storage/$$MINIO_BUCKET"
    restart: "no"

volumes:
  minio-data:
  keycloak-data:

networks:
  keycloak-internal:
    internal: true
