services:
  postgres:
    image: postgres:latest
    container_name: lms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-lms-backend:local}
    build:
      context: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lms_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8082}/realms/lms
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/lms/protocol/openid-connect/token
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/lms/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  keycloak-db:
    image: postgres:17
    networks:
      - keycloak-internal
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    networks:
      - default
      - keycloak-internal
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak/lms-realm.json:/opt/keycloak/data/import/lms-realm.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8082}:8080"
    environment:
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8082}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  keycloak-data:

networks:
  keycloak-internal:
    internal: true
