spring.application.name=lms-backend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/lms_db
spring.datasource.password=postgres
spring.datasource.username=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.data.web.pageable.max-page-size=100
# Application details at DEBUG; framework logging stays at INFO.
logging.level.root=INFO
logging.level.kz.edu.lms=DEBUG

# OpenAPI documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.override-with-generic-response=false

# Keycloak JWT validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/lms}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8082/realms/lms/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=lms-backend

keycloak.token-url=${KEYCLOAK_TOKEN_URL:http://localhost:8082/realms/lms/protocol/openid-connect/token}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:lms-postman}
